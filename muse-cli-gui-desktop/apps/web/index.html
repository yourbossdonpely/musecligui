<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0A0806" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0806" />
    <title>MuseCodeIcon by Don PELY</title>
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Resolve the theme and zoom before first paint so neither flashes its default.
      (function () {
        // The app is dark-and-gold on every platform, whatever the OS prefers.
        var theme = "dark";
        var zoom = 1;
        try {
          var prefs = JSON.parse(localStorage.getItem("musecodeicon.prefs.v1") || "{}");
          if (prefs.theme === "light" || prefs.theme === "dark") theme = prefs.theme;
          if (typeof prefs.zoom === "number" && isFinite(prefs.zoom)) zoom = prefs.zoom;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (zoom !== 1 && !("__TAURI_INTERNALS__" in window)) {
          document.documentElement.style.zoom = String(zoom);
          document.documentElement.style.setProperty("--app-zoom", String(zoom));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
