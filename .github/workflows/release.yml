name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds and republishes an existing tag: `gh workflow run release.yml --ref v0.23.6`. The ref
  # must be the tag itself: the guard job below refuses to publish anything else, so a manual run
  # from a branch cannot create a release named after the branch.
  workflow_dispatch:

# One release at a time, and never cancel a run halfway through uploading assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap pre-flight: fails in seconds, before three OS builds, if the tag is not a v* tag that
  # matches the version inside tauri.conf.json (artifact names and the release title come from it).
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the ref is a v* tag matching the app version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run this workflow on a v* tag: push one, or 'gh workflow run release.yml --ref vX.Y.Z'. Got $GITHUB_REF." >&2; exit 1 ;;
          esac
          version="$(node -p 'require("./muse-cli-gui-desktop/apps/desktop/src-tauri/tauri.conf.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in tauri.conf.json ($version). Bump it, or tag $version." >&2
            exit 1
          fi

  desktop-windows:
    permissions:
      contents: write
    needs: guard
    runs-on: windows-latest
    defaults:
      run:
        working-directory: muse-cli-gui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: muse-cli-gui-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace @musecodeicon/daemon --workspace @musecodeicon/ui --workspace @musecodeicon/server
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Which Node.js sidecar beforeBuildCommand bundles (apps/desktop/scripts/fetch-node.mjs).
          MUSECODEICON_NODE_TARGET: x86_64-pc-windows-msvc
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The folder holding src-tauri; the action resolves it from the repository root, not from
          # the run step's working-directory.
          projectPath: muse-cli-gui-desktop/apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "MuseCodeIcon ${{ github.ref_name }}"
          releaseBody: "Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). Unofficial community project, not affiliated with Meta. The Windows installer is not code signed yet, so SmartScreen may show a warning: click More info, then Run anyway. macOS builds are not Apple-notarized yet. On macOS 15 or later, first launch needs System Settings > Privacy & Security > Open Anyway (or run: xattr -dr com.apple.quarantine /Applications/MuseCodeIcon.app). On macOS 14 or earlier, right-click the app, then Open."
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          # The in-app updater reads latest.json from each release; each platform job
          # merges its own artifacts into it. Needs the TAURI_SIGNING_PRIVATE_KEY
          # and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repo secrets (the minisign key
          # in ~/.tauri/musecodeicon.key and its password file).
          includeUpdaterJson: true
          # CI has no code-signing cert; releases are signed on the release machine.
          args: --target x86_64-pc-windows-msvc --no-sign
      # A zip of the same runtime the installer lays down: exe, sidecar Node.js and resources. Unzip
      # anywhere and run musecodeicon.exe, no install and no admin rights.
      - name: Package and upload the Windows portable zip
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $release = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release"
          # Stage first: a --target build does not always leave the sidecar as `node.exe` in the
          # release folder, and the zip has to look exactly like an install (node.exe beside the exe).
          $stage = "portable-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $exe = Join-Path $release "musecodeicon.exe"
          if (-not (Test-Path $exe)) { throw "Missing portable payload: $exe" }
          Copy-Item $exe $stage
          $node = Join-Path $release "node.exe"
          if (-not (Test-Path $node)) {
            $node = Get-ChildItem -Path $release -Filter "node*.exe" -File | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $node) {
            # fetch-node.mjs leaves the sidecar under this name before Tauri copies it.
            $node = Get-ChildItem -Path "apps/desktop/src-tauri/binaries" -Filter "node*x86_64-pc-windows-msvc*.exe" -File | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $node) { throw "Missing the Node.js sidecar in $release or apps/desktop/src-tauri/binaries" }
          Copy-Item $node (Join-Path $stage "node.exe")
          # Tauri reads bundle.resources from src-tauri/resources and does not copy them into the
          # target folder, so that source tree is the one the bundle is actually built from.
          $resources = Join-Path $release "resources"
          if (-not (Test-Path $resources)) { $resources = "apps/desktop/src-tauri/resources" }
          if (-not (Test-Path (Join-Path $resources "server.cjs"))) { throw "Missing portable payload: $resources/server.cjs" }
          Copy-Item $resources $stage -Recurse
          $zip = "MuseCodeIcon_${version}_x64-portable.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          gh release upload "$env:GITHUB_REF_NAME" $zip --clobber

  desktop-macos:
    permissions:
      contents: write
    # After Windows, not beside it: all three jobs publish into the same release.
    needs: desktop-windows
    # macos-latest is arm64; the universal build adds the Intel half.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: muse-cli-gui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: muse-cli-gui-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both halves installed; aarch64 is the runner default.
          targets: x86_64-apple-darwin
      - run: npm ci
      - run: npm run build --workspace @musecodeicon/daemon --workspace @musecodeicon/ui --workspace @musecodeicon/server
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # fetch-node.mjs lipos the two architectures into node-universal-apple-darwin.
          MUSECODEICON_NODE_TARGET: universal-apple-darwin
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: muse-cli-gui-desktop/apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "MuseCodeIcon ${{ github.ref_name }}"
          releaseBody: "Bundles Node.js, so the only requirement is the Muse CLI with muse login. Unofficial community project, not affiliated with Meta. macOS builds are not Apple-notarized yet. On macOS 15 or later, first launch needs System Settings > Privacy & Security > Open Anyway (or run: xattr -dr com.apple.quarantine /Applications/MuseCodeIcon.app). On macOS 14 or earlier, right-click the app, then Open."
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          includeUpdaterJson: true
          # One universal .dmg for Apple Silicon and Intel; the bundle targets come from
          # tauri.macos.conf.json (app + dmg, ad-hoc signing).
          args: --target universal-apple-darwin
      # A zip of the .app itself, for people who want the app in ~/Applications without mounting a
      # disk image. ditto keeps the bundle's symlinks, permissions and signature intact.
      - name: Package and upload the macOS zip
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)"
          [ -n "$app" ] && [ -d "$app" ] || { echo "::error::Missing the macOS .app bundle" >&2; exit 1; }
          zip="MuseCodeIcon_${version}_universal-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
      # "Released" has to mean more than "compiled": start the bundle and ask it for its UI. The app
      # boots its own server in a thread and writes the port to its data dir before the window loads,
      # so this proves the sidecar Node.js, resources and frontend inside the .app all resolve.
      - name: Smoke test - launch the macOS bundle and check it serves its UI
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          app="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)"
          [ -n "$app" ] && [ -d "$app" ] || { echo "::error::No .app bundle to test" >&2; exit 1; }
          data="$HOME/Library/Application Support/com.musecodeicon.desktop"
          logs="$HOME/Library/Logs/com.musecodeicon.desktop"
          rm -rf "$data" "$logs"
          "$app/Contents/MacOS/musecodeicon" > app.log 2>&1 &
          pid=$!
          page="$(mktemp)"
          ok=0
          port=""
          for _ in $(seq 1 90); do
            if [ -f "$data/server-port" ]; then
              port="$(tr -dc 0-9 < "$data/server-port")"
              if [ -n "$port" ] && curl -fsS --max-time 2 "http://127.0.0.1:$port/" -o "$page"; then ok=1; break; fi
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != 1 ] || ! grep -qi '<title>MuseCodeIcon</title>' "$page"; then
            echo "::error::The macOS bundle never served its UI" >&2
            echo '--- app.log' ; cat app.log || true
            echo '--- server.log' ; cat "$logs/server.log" 2>/dev/null || true
            exit 1
          fi
          echo "macOS bundle served its UI on 127.0.0.1:$port"

  desktop-linux:
    permissions:
      contents: write
    # After Windows, which creates the release, but not after macOS: a macOS-only failure must not
    # skip the Linux bundle. Windows has already made the release by then, so neither job races to
    # create it.
    needs: desktop-windows
    # 22.04 keeps the glibc baseline low enough for every supported distro.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: muse-cli-gui-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: muse-cli-gui-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        # squashfs-tools is what the AppImage bundle is packed with; the rest is Tauri's documented
        # Debian list for WebKitGTK 4.1.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file zip xvfb dbus-x11 libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools
      - run: npm ci
      - run: npm run build --workspace @musecodeicon/daemon --workspace @musecodeicon/ui --workspace @musecodeicon/server
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Linux packages install to /usr/bin, so the sidecar is named musecodeicon-node-<triple>
          # there; tauri.linux.conf.json points externalBin at that name.
          MUSECODEICON_NODE_TARGET: x86_64-unknown-linux-gnu
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: muse-cli-gui-desktop/apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "MuseCodeIcon ${{ github.ref_name }}"
          releaseBody: "Bundles Node.js, so the only requirement is the Muse CLI with muse login. Unofficial community project, not affiliated with Meta. Linux x86_64 bundle (AppImage / .deb / .rpm)."
          releaseDraft: false
          prerelease: false
          retryAttempts: 3
          includeUpdaterJson: true
          # Bundle targets come from tauri.linux.conf.json (appimage, deb, rpm).
          args: --target x86_64-unknown-linux-gnu
      # The AppImage inside a zip, for people who would rather unpack one archive than chmod a
      # download. The bare AppImage stays on the release too.
      - name: Package and upload the Linux portable zip
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          appimage_dir="apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          appimage="$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -type f | head -1)"
          [ -n "$appimage" ] && [ -f "$appimage" ] || { echo "::error::Missing the Linux AppImage" >&2; exit 1; }
          zip="MuseCodeIcon_${version}_amd64-linux-portable.zip"
          cd "$appimage_dir"
          zip -j "$GITHUB_WORKSPACE/muse-cli-gui-desktop/$zip" "$(basename "$appimage")"
          cd "$GITHUB_WORKSPACE/muse-cli-gui-desktop"
          gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
      # The same proof on Linux: unpack the AppImage (no FUSE in CI), start it on a virtual display and
      # fetch the UI from the port its server publishes. WebKitGTK needs the compositing and sandbox
      # switches off to draw on Xvfb.
      - name: Smoke test - launch the Linux bundle and check it serves its UI
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          appimage_dir="apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          appimage="$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -type f | head -1)"
          [ -n "$appimage" ] && [ -f "$appimage" ] || { echo "::error::No AppImage to test" >&2; exit 1; }
          work="$(mktemp -d)"
          cp "$appimage" "$work/app.AppImage"
          cd "$work"
          chmod +x app.AppImage
          ./app.AppImage --appimage-extract > /dev/null
          export XDG_DATA_HOME="$work/xdg-data"
          export XDG_CACHE_HOME="$work/xdg-cache"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_FORCE_SANDBOX=0
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- ./squashfs-root/AppRun > app.log 2>&1 &
          pid=$!
          data="$work/xdg-data/com.musecodeicon.desktop"
          page="$work/page.html"
          ok=0
          port=""
          for _ in $(seq 1 90); do
            if [ -f "$data/server-port" ]; then
              port="$(tr -dc 0-9 < "$data/server-port")"
              if [ -n "$port" ] && curl -fsS --max-time 2 "http://127.0.0.1:$port/" -o "$page"; then ok=1; break; fi
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$ok" != 1 ] || ! grep -qi '<title>MuseCodeIcon</title>' "$page"; then
            echo "::error::The Linux bundle never served its UI" >&2
            echo '--- app.log' ; cat app.log || true
            echo '--- server.log' ; cat "$data/logs/server.log" 2>/dev/null || true
            exit 1
          fi
          echo "Linux bundle served its UI on 127.0.0.1:$port"

  # One SHA256SUMS per release, so copies of the installers on mirror sites can be checked against it.
  checksums:
    permissions:
      contents: write
    needs: [desktop-windows, desktop-macos, desktop-linux]
    # Only when every installer made it; a partial list is worse than none.
    if: ${{ needs.desktop-windows.result == 'success' && needs.desktop-macos.result == 'success' && needs.desktop-linux.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Publish SHA256SUMS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          # gh infers nothing from a temp dir, so the repository is passed explicitly.
          installers=('MuseCodeIcon_*_x64-setup.exe' 'MuseCodeIcon_*_universal.dmg' 'MuseCodeIcon_*_amd64.AppImage' 'MuseCodeIcon_*_amd64.deb' 'MuseCodeIcon-*.x86_64.rpm' 'MuseCodeIcon_universal.app.tar.gz' 'MuseCodeIcon_*_x64-portable.zip' 'MuseCodeIcon_*_universal-macos.zip' 'MuseCodeIcon_*_amd64-linux-portable.zip')
          for pattern in "${installers[@]}"; do
            # A pattern that matches nothing exits non-zero; report which installer is missing instead.
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$pattern" || true
            compgen -G "$pattern" > /dev/null || { echo "::error::Missing release asset: $pattern" >&2; exit 1; }
          done
          shopt -s nullglob
          sha256sum MuseCodeIcon_* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS --clobber

